name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    # A hung step otherwise sits on GitHub's 360-minute default, burning
    # runner time and leaving the PR amber with no signal. 20 minutes is
    # ~6x the normal run, so a real slow-down still passes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The staging one-paste schema (supabase/baseline.sql) must never
      # drift behind the migrations — regenerate and fail if it changed.
      - name: Baseline schema is current
        run: |
          node scripts/make-baseline.mjs
          git diff --exit-code supabase/baseline.sql
      # A build-breaking change must fail CI, not just the Vercel preview.
      - run: npm run build

  e2e:
    name: Critical flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Browsers are ~150MB and the download is the slow half of this job;
      # the deps step below is the half that HANGS. Cached on the resolved
      # Playwright version, so a version bump invalidates it and nothing
      # else does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # NO `install-deps` (2026-08-19). It was the thing hanging, and the
      # timeout added earlier that day finally produced a readable log:
      # every library Chromium actually needs — libxkbcommon0, libxrandr2,
      # libfontconfig1, libfreetype6, fonts-liberation — reported "already
      # the newest version" on the runner image. The 21MB it then spent
      # three minutes a package fetching was OPTIONAL CJK and Cyrillic
      # fonts (ipafont, wqy-zenhei, unifont, xfonts-cyrillic), which an
      # English-language suite renders nothing with.
      #
      # So the step was buying nothing and costing everything. If a real
      # library ever does go missing from the image, the browser fails to
      # launch in the test step — loud, immediate, and easy to read, which
      # is more than the hang ever was.
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 5
      # Build as its own step, in the same preview env the suite serves under,
      # so a slow cold build can't burn the webServer readiness timeout (that
      # deadline shrank as the app grew and started failing CI mid-compile).
      # PLAYWRIGHT_SKIP_BUILD then has the suite only start the server.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          NEXT_PUBLIC_STREAM_API_KEY: ""
          STREAM_API_SECRET: ""
          ALLOW_UNCONFIGURED_PREVIEW: "1"
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  contrast:
    name: Contrast (WCAG AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Browsers are ~150MB and the download is the slow half of this job;
      # the deps step below is the half that HANGS. Cached on the resolved
      # Playwright version, so a version bump invalidates it and nothing
      # else does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # NO `install-deps` (2026-08-19). It was the thing hanging, and the
      # timeout added earlier that day finally produced a readable log:
      # every library Chromium actually needs — libxkbcommon0, libxrandr2,
      # libfontconfig1, libfreetype6, fonts-liberation — reported "already
      # the newest version" on the runner image. The 21MB it then spent
      # three minutes a package fetching was OPTIONAL CJK and Cyrillic
      # fonts (ipafont, wqy-zenhei, unifont, xfonts-cyrillic), which an
      # English-language suite renders nothing with.
      #
      # So the step was buying nothing and costing everything. If a real
      # library ever does go missing from the image, the browser fails to
      # launch in the test step — loud, immediate, and easy to read, which
      # is more than the hang ever was.
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 5
      # Same credential-free preview build the e2e suite uses: the audit only
      # needs rendered markup, and preview mode reaches every route without
      # a database.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          NEXT_PUBLIC_STREAM_API_KEY: ""
          STREAM_API_SECRET: ""
          ALLOW_UNCONFIGURED_PREVIEW: "1"
      # Contrast has regressed twice now in ways a stylesheet review missed
      # (a hover state that undid its own fix, a token applied to the wrong
      # surface). This measures what the browser actually paints and fails
      # the build above the allowed count.
      - name: Contrast audit
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done
          npm run contrast
        env:
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          NEXT_PUBLIC_STREAM_API_KEY: ""
          STREAM_API_SECRET: ""
          ALLOW_UNCONFIGURED_PREVIEW: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: contrast-report
          path: contrast-report.json
          retention-days: 7
